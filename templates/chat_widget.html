<!-- Forensic AI Chat Widget -->
<style>
    .ai-chat-fab {
        position: fixed;
        bottom: 32px;
        right: 32px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: none;
        z-index: 1000;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        background: #000;
        border: 1px solid var(--accent);
        box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
        will-change: transform;
        touch-action: none;
    }

    .ai-chat-fab:hover {
        transform: translateY(-4px) scale(1.05);
        box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
    }

    .ai-chat-fab img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        filter: grayscale(1) brightness(1.2) contrast(1.1);
        transition: filter 0.3s ease;
    }
    
    .ai-chat-fab:hover img {
        filter: grayscale(0) brightness(1);
    }

    .chat-notification {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 18px;
        height: 18px;
        background: var(--accent);
        border: 2px solid #000;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 900;
        color: #000;
        z-index: 10;
        animation: pulseAlpha 2s infinite;
    }

    @keyframes pulseAlpha {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.1); }
    }

    .ai-chat-window {
        position: fixed;
        bottom: 110px;
        right: 32px;
        width: 380px;
        height: min(520px, calc(100vh - 140px));
        background: rgba(5, 5, 8, 0.95);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid var(--border-medium);
        border-radius: 4px; /* Shorter corners as per new system */
        z-index: 999;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translateY(20px);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    }

    .ai-chat-window.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
    }

    .ai-chat-window::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0.6;
    }

    .ai-chat-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.02);
    }

    .ai-chat-title h4 {
        margin: 0;
        font-size: 0.75em;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-primary);
    }

    .ai-chat-status {
        margin: 2px 0 0 0;
        font-size: 10px;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: monospace;
        letter-spacing: 1px;
    }

    .status-dot {
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent);
    }

    .ai-chat-close {
        width: 32px;
        height: 32px;
        background: transparent;
        border: 1px solid var(--border-subtle);
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: none;
        transition: all 0.2s ease;
        color: var(--text-muted);
    }

    .ai-chat-close:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    .ai-chat-body {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: linear-gradient(to bottom, transparent, rgba(0, 242, 255, 0.01));
    }

    .chat-message {
        max-width: 85%;
        padding: 14px 18px;
        font-size: 13px;
        line-height: 1.6;
        animation: slideInHUD 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        position: relative;
    }

    @keyframes slideInHUD {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .chat-message.bot {
        background: var(--surface-2);
        border: 1px solid var(--border-subtle);
        color: var(--text-primary);
        align-self: flex-start;
        border-radius: 2px;
        border-left: 2px solid var(--accent);
    }

    .chat-message.user {
        background: var(--accent);
        color: #000;
        align-self: flex-end;
        border-radius: 2px;
        font-weight: 700;
        box-shadow: 0 4px 12px rgba(0, 242, 255, 0.2);
    }

    .ai-chat-footer {
        padding: 20px;
        border-top: 1px solid var(--border-subtle);
        background: rgba(255, 255, 255, 0.02);
    }

    .ai-chat-form {
        display: flex;
        gap: 8px;
    }

    .ai-chat-input {
        flex: 1;
        padding: 12px 16px;
        background: #000;
        border: 1px solid var(--border-medium);
        border-radius: 2px;
        color: var(--text-primary);
        font-family: 'Space Grotesk', sans-serif;
        font-size: 13px;
        outline: none;
        transition: all 0.2s ease;
    }

    .ai-chat-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 10px rgba(0, 242, 255, 0.05);
    }

    .ai-chat-submit {
        width: 42px;
        height: 42px;
        background: var(--accent);
        border: none;
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: none;
        transition: all 0.2s ease;
    }

    .ai-chat-submit:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px var(--accent-glow);
    }

    .ai-chat-submit svg {
        width: 18px;
        height: 18px;
        stroke: #000;
    }

    /* Scrollbar */
    .ai-chat-body::-webkit-scrollbar { width: 4px; }
    .ai-chat-body::-webkit-scrollbar-track { background: transparent; }
    .ai-chat-body::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 10px; }
</style>

{% load static %}
<div class="ai-chat-fab" id="aiChatFab">
    <img src="{% static 'avatar.png' %}" alt="AI Assistant">
    <div class="chat-notification" id="chatNotification">1</div>
</div>

<div class="ai-chat-window" id="aiChatWindow">
    <div class="ai-chat-header">
        <div class="ai-chat-title">
            <h4>Forensic Support</h4>
            <p class="ai-chat-status">
                <span class="status-dot"></span>
                <span>SECURE_NODE_ACTIVE</span>
            </p>
        </div>
        <button class="ai-chat-close" id="aiChatClose">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <div class="ai-chat-body" id="aiChatBody">
        <div class="chat-message bot">
            SYSTEM: Analysis stream initialized. Evidence samples successfully integrated. Diagnostic questions accepted in this terminal.
        </div>
        <div class="typing-indicator" id="aiChatTyping" style="display:none; padding: 14px 18px; font-family: monospace; font-size: 10px; color: var(--accent);">
            PROCCESSING_RESPONSE...
        </div>
    </div>

    <div class="ai-chat-footer">
        <form class="ai-chat-form" id="aiChatForm">
            {% csrf_token %}
            <input type="text" class="ai-chat-input" id="aiChatInput" placeholder="ENTER_QUERY..." autocomplete="off" required>
            <button type="submit" class="ai-chat-submit">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </form>
    </div>
</div>

<script>
    const aiChatFab = document.getElementById('aiChatFab');
    const aiChatWindow = document.getElementById('aiChatWindow');
    const aiChatClose = document.getElementById('aiChatClose');
    const chatNotification = document.getElementById('chatNotification');
    const aiChatBody = document.getElementById('aiChatBody');
    const aiChatForm = document.getElementById('aiChatForm');
    const aiChatInput = document.getElementById('aiChatInput');
    const aiChatTyping = document.getElementById('aiChatTyping');

    // Toggle chat
    aiChatFab.addEventListener('click', () => {
        aiChatWindow.classList.toggle('active');
        if (aiChatWindow.classList.contains('active')) {
            chatNotification.style.display = 'none';
        }
    });

    aiChatClose.addEventListener('click', () => {
        aiChatWindow.classList.remove('active');
    });

    // Handle messages
    aiChatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = aiChatInput.value.trim();
        if (!message) return;

        const userMsg = document.createElement('div');
        userMsg.className = 'chat-message user';
        userMsg.textContent = message;
        aiChatBody.insertBefore(userMsg, aiChatTyping);
        
        aiChatInput.value = '';
        aiChatTyping.style.display = 'block';
        aiChatBody.scrollTop = aiChatBody.scrollHeight;

        try {
            const formData = new FormData();
            formData.append('message', message);
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;

            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: csrfToken ? { 'X-CSRFToken': csrfToken } : {},
                body: formData
            });

            const data = await response.json();
            aiChatTyping.style.display = 'none';

            const botMsg = document.createElement('div');
            botMsg.className = 'chat-message bot';
            botMsg.textContent = data.reply || "SIGNAL_LOST: REPEAT_COMMAND";
            
            aiChatBody.insertBefore(botMsg, aiChatTyping);
            aiChatBody.scrollTop = aiChatBody.scrollHeight;
        } catch (error) {
            aiChatTyping.style.display = 'none';
            const errorMsg = document.createElement('div');
            errorMsg.className = 'chat-message bot';
            errorMsg.style.borderColor = 'var(--accent-danger)';
            errorMsg.textContent = 'SYSTEM_ERROR: CONNECTION_FAILURE';
            aiChatBody.insertBefore(errorMsg, aiChatTyping);
        }
    });
</script>
