<section id="chat" class="panel" aria-label="Glossary helper">
  <h2>Ask about a check</h2>
  <p class="caveat">A keyword helper, not a model. It explains terms and summarises the result above.</p>
  <div id="chat-log" aria-live="polite"></div>
  <form id="chat-form">{% csrf_token %}
    <input name="message" maxlength="500" placeholder="What is ELA? Why was this flagged?" aria-label="Question" required>
    <button type="submit">Ask</button>
  </form>
</section>
<script>
(function () {
  var form = document.getElementById('chat-form'), log = document.getElementById('chat-log');
  function add(text, who) { var p = document.createElement('p'); p.textContent = (who ? who + ': ' : '') + text; log.appendChild(p); log.scrollTop = log.scrollHeight; }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var input = form.elements.message, msg = input.value.trim();
    if (!msg) return;
    add(msg, 'You'); input.value = '';
    var body = new FormData(); body.append('message', msg);
    fetch('/api/chat/', { method: 'POST', body: body,
      headers: { 'X-CSRFToken': form.elements.csrfmiddlewaretoken.value } })
      .then(function (r) { return r.json(); })
      .then(function (j) { add(j.reply || j.error || 'No reply.', 'Helper'); })
      .catch(function () { add('Request failed.', 'Helper'); });
  });
})();
</script>
