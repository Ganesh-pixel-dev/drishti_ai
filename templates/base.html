<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drishti AI | Forensic Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700;900&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Portfolio-inspired "Eye-Soothing" Dark Palette */
            --bg: #050508;
            --surface: #0a0a0f;
            --surface-2: #12121e;
            --text-primary: #f1f5f9;
            --text-secondary: rgba(241, 245, 249, 0.65);
            --text-muted: rgba(241, 245, 249, 0.35);
            /* New Forensic Identity: Electric Blue */
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.08); /* Decreased glow */
            --accent-danger: #ff3366;
            --accent-success: #10b981;
            
            --border-subtle: rgba(255, 255, 255, 0.04);
            --border-medium: rgba(255, 255, 255, 0.1);
            --glass: rgba(255, 255, 255, 0.02);
            --blueprint: rgba(0, 242, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Viewport Lock */
            height: 100vh;
            -webkit-font-smoothing: antialiased;
            cursor: none;
        }

        /* ─── FILM GRAIN (Ported from Portfolio) ─── */
        body::after {
            content: '';
            position: fixed; inset: 0; z-index: 9990;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.02;
            mix-blend-mode: overlay;
        }

        h1, h2, h3, h4 {
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        /* ─── ATMOSPHERICS ─── */
        #spotlight {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(500px circle at var(--mx, 50%) var(--my, 50%), var(--accent-glow), transparent 70%);
        }

        #particle-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            opacity: 0.6;
        }

        .nebula-blob {
            position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0;
            opacity: 0.4;
        }
        .blob-cyan { width: 60vw; height: 60vw; top: -10vh; left: -10vw; background: radial-gradient(circle, rgba(0, 242, 255, 0.06) 0%, transparent 70%); animation: drift 25s infinite alternate ease-in-out; }
        .blob-purple { width: 50vw; height: 50vw; bottom: -10vh; right: -10vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.04) 0%, transparent 70%); animation: drift 20s infinite alternate-reverse ease-in-out; }
        
        @keyframes drift { to { transform: translate(5vw, 5vh) scale(1.1); } }

        /* ─── CUSTOM CURSOR (Forensic Lens) ─── */
        #cursor-dot {
            position: fixed; z-index: 99999; pointer-events: none;
            width: 4px; height: 4px;
            background: var(--accent); border-radius: 50%;
            transform: translate(-50%,-50%);
            transition: width 0.25s, height 0.25s, background 0.25s;
            box-shadow: 0 0 5px rgba(0, 242, 255, 0.5); /* Backlit effect */
        }
        #cursor-ring {
            position: fixed; z-index: 99998; pointer-events: none;
            width: 24px; height: 24px;
            border: 1px solid rgba(0, 242, 255, 0.15);
            border-radius: 50%;
            transform: translate(-50%,-50%);
            transition: width 0.35s cubic-bezier(.16,1,.3,1), height 0.35s cubic-bezier(.16,1,.3,1), border-color 0.35s;
            display: grid; place-items: center;
        }
        body.cursor-active #cursor-ring { width: 36px; height: 36px; border-color: rgba(0, 242, 255, 0.6); background: rgba(0, 242, 255, 0.03); }

        .trail-dot {
            position: fixed; top: 0; left: 0;
            width: 4px; height: 4px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99997;
            margin-left: -2px; margin-top: -2px;
            box-shadow: 0 0 4px var(--accent);
        }

        /* ─── LAYOUT ─── */
        .container {
            max-width: 1600px; /* Slightly wider for dashboard feel */
            margin: 0 auto;
            padding: 0 40px;
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 0;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .main-content {
            flex: 1;
            min-height: 0; /* Critical for inner scrolling */
            padding: 32px 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Allow scrolling for responsive layouts */
        }

        /* ─── DASHBOARD GRID (Responsive) ─── */
        .dashboard-grid {
            flex: 1; 
            min-height: 0; 
            display: grid; 
            grid-template-columns: 1fr 450px; 
            gap: 32px; 
            padding-bottom: 10px;
        }

        .dashboard-grid.text-grid {
            grid-template-columns: 1fr 480px; 
        }

        @media (max-width: 1024px) {
            .dashboard-grid, .dashboard-grid.text-grid {
                grid-template-columns: 1fr;
                min-height: auto;
            }
            .dashboard-grid > div {
                min-height: auto;
            }
            /* Hide inner scroll on mobile to let main scroll handle it */
            .glass-card .inner-scroll {
                overflow-y: visible !important;
            }
        }

        .logo-top {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 900;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 2px;
        }
        .logo-top span { color: var(--accent); }
        .logo-top svg { color: var(--accent); }

        .nav {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            padding: 10px 24px;
            border-radius: 4px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
        }

        .nav-link:hover {
            color: var(--accent);
            border-color: rgba(0, 242, 255, 0.2);
            background: rgba(0, 242, 255, 0.03);
            transform: translateY(-1px);
        }

        .nav-link.active {
            color: var(--accent);
            border-color: rgba(0, 242, 255, 0.4);
            background: rgba(0, 242, 255, 0.05);
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.05);
        }

        /* ─── COMPONENTS ─── */
        .glass-card {
            background: var(--surface);
            border: 1px solid var(--border-medium);
            border-radius: 4px; /* Shaper, more professional corners */
            padding: 40px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            backdrop-filter: blur(20px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            border-color: rgba(0, 242, 255, 0.2);
        }

        /* Portfolio-style Corner Brackets */
        .glass-card::before, .glass-card::after {
            content: '';
            position: absolute;
            width: 15px; height: 15px;
            border: 1px solid var(--accent);
            opacity: 0.3;
            pointer-events: none;
        }
        .glass-card::before { top: 15px; left: 15px; border-right: 0; border-bottom: 0; }
        .glass-card::after { bottom: 15px; right: 15px; border-left: 0; border-top: 0; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 32px;
            border-radius: 2px;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: none;
            transition: all 0.35s cubic-bezier(.16,1,.3,1);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: ''; position: absolute; inset: 0;
            background: var(--accent); transform: translateX(-101%);
            transition: transform 0.35s cubic-bezier(.16,1,.3,1);
            z-index: -1;
        }

        .btn:hover { color: #000; }
        .btn:hover::after { transform: translateX(0); }

        .btn-secondary {
            border-color: var(--border-medium);
            color: var(--text-secondary);
        }
        .btn-secondary::after { background: var(--text-primary); }

        /* ─── GLOBAL FORENSIC PROGRESS HUD ─── */
        #globalForensicLoader {
            display: none; position: fixed; inset: 0;
            background: rgba(5, 5, 8, 0.98);
            z-index: 99999;
            flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* Scanning HUD Logic (Ported from Portfolio vibe) */
        .scan-line {
            position: absolute; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: scanLoop 4s linear infinite;
            box-shadow: 0 0 20px var(--accent);
            opacity: 0.3;
        }
        @keyframes scanLoop { from { top: -10%; } to { top: 110%; } }

        .hud-grid {
            position: absolute; inset: 0;
            background-image: linear-gradient(var(--border-subtle) 1px, transparent 1px), linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.2;
            z-index: -1;
        }

        /* PAGE SMOOTH TRANSITIONS */
        .page-translatable {
            opacity: 0; 
            transform: translateY(15px);
            animation: slideFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideFadeIn { 100% { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>
    <div id="spotlight"></div>
    <canvas id="particle-canvas"></canvas>
    <div class="nebula-blob blob-cyan"></div>
    <div class="nebula-blob blob-purple"></div>
    
    <div id="cursor-trail-container"></div>
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <div class="container page-translatable" id="mainWrapper">
        <header class="header">
            <a href="/" class="logo-top">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                DRISHTI<span>AI</span>
            </a>
            
            <nav class="nav">
                {% with path=request.path %}
                <a href="/" class="nav-link {% if path == '/' %}active{% endif %}">Image</a>
                <a href="/video/" class="nav-link {% if '/video' in path %}active{% endif %}">Video</a>
                <a href="/text/" class="nav-link {% if '/text' in path %}active{% endif %}">Text</a>
                {% endwith %}
            </nav>
        </header>

        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script>
        // Custom Cursor & Spotlight Logic with Smoothing (LERP)
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');
        const spotlight = document.getElementById('spotlight');
        const trailContainer = document.getElementById('cursor-trail-container');

        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let ringX = mouseX, ringY = mouseY;
        let spotX = mouseX, spotY = mouseY;

        // Trail dots setup
        const trailDots = [];
        const numDots = 14;
        for (let i = 0; i < numDots; i++) {
            const el = document.createElement('div');
            el.className = 'trail-dot';
            const scale = 1 - (i / numDots);
            el.style.opacity = 1 - (i / numDots);
            trailContainer.appendChild(el);
            trailDots.push({ node: el, x: mouseX, y: mouseY, scale: scale });
        }

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // Immediate update for the dot
            dot.style.left = mouseX + 'px';
            dot.style.top = mouseY + 'px';

            // Detect interactive elements
            const target = e.target;
            if (target.closest('a, button, input, .stat-card, .glass-card')) {
                document.body.classList.add('cursor-active');
            } else {
                document.body.classList.remove('cursor-active');
            }
        });

        function animate() {
            // LERP smoothing: target += (target - current) * factor
            ringX += (mouseX - ringX) * 0.15;
            ringY += (mouseY - ringY) * 0.15;
            
            spotX += (mouseX - spotX) * 0.1;
            spotY += (mouseY - spotY) * 0.1;

            ring.style.left = ringX + 'px';
            ring.style.top = ringY + 'px';
            
            spotlight.style.setProperty('--mx', spotX + 'px');
            spotlight.style.setProperty('--my', spotY + 'px');

            // Trail physics
            trailDots[0].x += (mouseX - trailDots[0].x) * 0.6;
            trailDots[0].y += (mouseY - trailDots[0].y) * 0.6;
            trailDots[0].node.style.transform = `translate(${trailDots[0].x}px, ${trailDots[0].y}px) scale(${trailDots[0].scale})`;
            
            for (let i = 1; i < numDots; i++) {
                trailDots[i].x += (trailDots[i-1].x - trailDots[i].x) * 0.6;
                trailDots[i].y += (trailDots[i-1].y - trailDots[i].y) * 0.6;
                trailDots[i].node.style.transform = `translate(${trailDots[i].x}px, ${trailDots[i].y}px) scale(${trailDots[i].scale})`;
            }

            requestAnimationFrame(animate);
        }
        animate();

        // ─── PARTICLE SYSTEM (Ported from Portfolio) ───
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [], scrollVel = 0, lastSY = 0;

        const resizeCanvas = () => { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        };
        resizeCanvas();
        window.addEventListener('resize', () => { resizeCanvas(); buildPts(); });

        class Star {
            constructor(layer) {
                this.layer = layer;
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = this.layer * 0.4 + Math.random() * 0.5;
                this.speedY = 0.04 + this.layer * 0.1;
                this.alpha = 0.05 + (this.layer / 3) * 0.3;
                this.phase = Math.random() * Math.PI * 2;
                this.phaseSpd = 0.01 + Math.random() * 0.02;
            }
            update() {
                this.phase += this.phaseSpd;
                const a = this.alpha * (0.6 + 0.4 * Math.sin(this.phase));
                const dx = mouseX - this.x, dy = mouseY - this.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < 200) { 
                    this.x -= dx * 0.005; 
                    this.y -= dy * 0.005; 
                }
                this.y -= this.speedY * (1 + Math.abs(scrollVel) * 0.1);
                if (this.y < -10) this.y = canvas.height + 10;
                if (this.y > canvas.height + 10) this.y = -10;
                if (this.x < -10) this.x = canvas.width + 10;
                if (this.x > canvas.width + 10) this.x = -10;
                return a;
            }
            draw(a) {
                const stretch = 1 + Math.abs(scrollVel) * 0.05;
                ctx.fillStyle = `rgba(0, 242, 255, ${a})`;
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, this.size, this.size * stretch, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function buildPts() {
            pts = [];
            [200, 80, 30].forEach((n, i) => { for (let j = 0; j < n; j++) pts.push(new Star(i + 1)); });
        }
        buildPts();

        function drawConstellations() {
            const near = pts.filter(p => { 
                const dx = mouseX - p.x, dy = mouseY - p.y; 
                return dx * dx + dy * dy < 150 * 150; 
            });
            near.forEach(a => {
                near.forEach(b => {
                    if (a === b) return;
                    const dx = a.x - b.x, dy = a.y - b.y, d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 100) {
                        ctx.strokeStyle = `rgba(0, 242, 255, ${(1 - d / 100) * 0.1})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                    }
                });
            });
        }

        (function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const sy = window.pageYOffset;
            scrollVel = sy - lastSY; lastSY = sy;
            pts.forEach(p => p.draw(p.update()));
            drawConstellations();
            requestAnimationFrame(renderLoop);
        })();

        // Global Forensic Progress HUD
        const startForensicScan = () => {
            const loader = document.getElementById('globalForensicLoader');
            const progressFill = document.getElementById('globalProgressFill');
            const progressPercent = document.getElementById('globalProgressPercent');
            const statusText = document.getElementById('globalStatusText');
            
            if (!loader) return;
            loader.style.display = 'flex';

            const statuses = [
                { text: "CALIBRATING FORENSIC SENSORS...", p: 10 },
                { text: "SAMPLING NOISE FINGERPRINTS...", p: 30 },
                { text: "AUDITING GEOMETRIC CONSISTENCY...", p: 50 },
                { text: "RUNNING NEURAL TEXTURE ANALYSIS...", p: 75 },
                { text: "FINALIZING EVIDENCE VERDICT...", p: 95 }
            ];

            let curP = 0;
            let curS = 0;
            const timer = setInterval(() => {
                if (curP < 98) {
                    curP += (curP < 60) ? 0.3 : 0.1;
                    progressFill.style.width = curP + "%";
                    progressPercent.innerText = Math.floor(curP) + "%";
                    
                    if (curS < statuses.length && curP >= statuses[curS].p) {
                        statusText.innerText = statuses[curS].text;
                        curS++;
                    }
                } else {
                    clearInterval(timer);
                }
            }, 50);
        };

        document.addEventListener('submit', (e) => {
            if (e.target.classList && e.target.classList.contains('forensic-form')) {
                startForensicScan();
            }
        });
    </script>

    <!-- Global Forensic Progress HUD -->
    <div id="globalForensicLoader">
        <div class="hud-grid"></div>
        <div class="scan-line"></div>
        
        <div style="text-align: center; z-index: 10;">
            <div id="globalProgressPercent" style="font-size: 6em; font-weight: 900; font-family: 'Space Grotesk', sans-serif; color: var(--accent); line-height: 1; margin-bottom: 20px;">0%</div>
            <p id="globalStatusText" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: white; font-size: 0.9em; letter-spacing: 5px; text-transform: uppercase;">Initializing Forensic Scan...</p>
            
            <div style="width: 400px; height: 1px; background: var(--border-medium); margin: 30px auto; position: relative; overflow: hidden;">
                <div id="globalProgressFill" style="position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: var(--accent); transition: width 0.1s linear;"></div>
            </div>
            <p style="font-family: monospace; font-size: 0.65rem; color: var(--text-muted); letter-spacing: 2px;">DRISHTI ARMADA v2.4 // SECURE SESSION</p>
        </div>
    </div>
</body>
</html>
