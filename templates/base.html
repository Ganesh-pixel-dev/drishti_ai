<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Drishti AI{% endblock %}</title>
<style>
:root {
  --paper: #f3f1ec; --panel: #fbfaf7; --ink: #1b1c1e; --muted: #5e6166; --line: #d7d4cc;
  --accent: #b4381c; --accent-soft: #f3d9d1; --ok: #2f5d46; --bar: #8a8d92;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #15161a; --panel: #1c1d22; --ink: #e8e6e1; --muted: #a0a2a8; --line: #33353b;
          --accent: #ee7a5c; --accent-soft: #3a2119; --ok: #7bb591; --bar: #6f7279; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
header.top { border-bottom: 1px solid var(--line); background: var(--panel); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 28px; padding-top: 14px; padding-bottom: 14px; }
.brand { font-weight: 700; letter-spacing: .02em; text-decoration: none; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 8px; }
nav a { text-decoration: none; margin-right: 18px; color: var(--muted); padding: 4px 0; border-bottom: 2px solid transparent; }
nav a[aria-current="page"], nav a:hover { color: var(--ink); border-bottom-color: var(--accent); }
main { padding: 28px 0 56px; }
h1 { font-size: 1.6rem; margin: 0 0 6px; }
h2 { font-size: 1.1rem; margin: 0 0 10px; }
.lede { color: var(--muted); margin: 0 0 22px; max-width: 62ch; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 18px; margin-bottom: 20px; }
.label, th { font: 600 .72rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mono { font-family: var(--mono); }
form.upload { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
input[type=file], textarea { font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); padding: 10px; max-width: 100%; }
textarea { width: 100%; min-height: 180px; }
button, .btn { font: 600 .9rem var(--sans); background: var(--ink); color: var(--paper); border: 0; padding: 11px 20px; cursor: pointer; }
button:hover { background: var(--accent); color: #fff; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.error { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; margin-bottom: 18px; }
.notice { border-left: 4px solid var(--bar); background: var(--panel); padding: 12px 14px; margin: 0 0 18px; color: var(--muted); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
figure { margin: 0; }
figure img { width: 100%; height: auto; display: block; border: 1px solid var(--line); }
figcaption { font-size: .85rem; color: var(--muted); margin-top: 6px; }
.verdict { font-size: 1.15rem; font-weight: 600; margin: 4px 0 2px; }
.verdict.flag { color: var(--accent); }
.meter { height: 8px; background: var(--line); position: relative; margin: 6px 0 4px; }
.meter > i { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.meter.flag > i { background: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
.bar { display: inline-block; height: 8px; background: var(--bar); vertical-align: middle; }
.bar.pos { background: var(--accent); }
.scroll { overflow-x: auto; }
.caveat { font-size: .88rem; color: var(--muted); }
.caveat strong { color: var(--ink); }
details { margin-top: 10px; }
summary { cursor: pointer; font-weight: 600; }
#chat { margin-top: 28px; }
#chat-log { min-height: 48px; max-height: 240px; overflow: auto; font-size: .93rem; }
#chat-log p { margin: 6px 0; }
#chat-form { display: flex; gap: 8px; margin-top: 8px; }
#chat-form input { flex: 1; font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); padding: 9px; min-width: 0; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/">Drishti AI<small>image, video and text checks</small></a>
  <nav aria-label="Main">
    <a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Image</a>
    <a href="/video/" {% if '/video/' in request.path %}aria-current="page"{% endif %}>Video</a>
    <a href="/text/" {% if '/text/' in request.path %}aria-current="page"{% endif %}>Text</a>
  </nav>
</div></header>
<main><div class="wrap">
{% block content %}{% endblock %}
</div></main>
</body>
</html>
